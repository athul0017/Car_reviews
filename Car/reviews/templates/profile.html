{% extends 'layout_inner.html' %}
{% load static %}

{% block content %}
<div class="container" style="margin-top: 50px;">
    <div class="row">
        <div class="col-md-4 col-md-offset-4">
            <div class="panel panel-default">
                <div class="panel-heading text-center">
                    <h3>User Profile</h3>
                </div>
                <div class="panel-body text-center">
                    <img src="{% static 'images/default-profile.jpg' %}" alt="Profile Picture" class="img-circle" width="120">
                    <h4 class="text-primary">John Doe</h4>
                    <p class="text-muted">Web Developer</p>
                    <button class="btn btn-info btn-sm" id="edit-profile">Edit Profile</button>
                    <hr>
                    <h4 class="text-success">Watchlist</h4>
                    <ul class="list-group">
                        <li class="list-group-item">Car 1 - Description</li>
                        <li class="list-group-item">Car 2 - Description</li>
                        <li class="list-group-item">Car 3 - Description</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
