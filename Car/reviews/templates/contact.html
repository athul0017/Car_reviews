{% extends "layout_inner.html" %}
{% load static %}


{% block title %}Contact Us{% endblock %}

{% block content %}
<style>
    .contact-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        padding: 40px;
        background-color: #f5f0eb;
        font-family: 'Helvetica Neue', sans-serif;
    }

    .contact-image {
        flex: 1;
    }

    .contact-image img {
        width: 100%;
        border-radius: 10px;
    }

    .contact-form-section {
        flex: 1;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .contact-form-section h2 {
        font-size: 36px;
        margin-bottom: 20px;
    }

    form label {
        font-weight: 600;
        display: block;
        margin-top: 15px;
    }

    form input,
    form textarea {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fafafa;
    }

    form button {
        background-color: black;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 999px;
        font-weight: bold;
        margin-top: 20px;
        cursor: pointer;
    }

    .contact-info {
        margin-top: 30px;
        font-size: 14px;
    }

    .social-icons {
        margin-top: 20px;
        display: flex;
        gap: 15px;
    }

    .social-icons a {
        text-decoration: none;
        color: black;
        font-size: 20px;
    }
</style>

<div class="contact-container">
    <div class="contact-image">
        <img src="{% static 'assets/images/login/crreviewimge.png' %}" alt="Contact">
        <!-- Replace 'contact_photo.png' with the actual image path -->
    </div>
    <div class="contact-form-section">
        <h2>Contact Us</h2>
        <form method="post">
            {% csrf_token %}
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Contact Us</button>
        </form>

        
    </div>
</div>
{% endblock %}
