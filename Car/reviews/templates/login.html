{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #c8e6c9;
        }

        .main-container {
            display: flex;
            width: 900px;
            height: 500px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }

        .form-section {
            flex: 1;
            padding: 40px;
            background-color: #fffde7;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            color: #66bb6a;
            margin-bottom: 20px;
            font-size: 26px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
        }

        label {
            font-size: 14px;
            color: #333;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        button {
            background-color: #1976d2;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1565c0;
        }

        .switch-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .switch-link a {
            color: #388e3c;
            text-decoration: none;
            font-weight: bold;
        }

        .image-section {
            flex: 1;
            background: url("{% static 'assets/images/login/carlogin.png' %}") no-repeat center center;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-section">
            <h2>Login</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="actions">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit">Login</button>
            </form>
            <div class="switch-link">
                Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
            </div>
        </div>
        <div class="image-section"></div>
    </div>
</body>
</html>
